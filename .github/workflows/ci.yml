name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    # fdroid and github are both GMS-free and otherwise identical from CI's point of view (only
    # github carries the real SelfUpdateChecker, which doesn't change what gets built/tested here)
    # - a matrix avoids duplicating every step below twice.
    strategy:
      matrix:
        # Gradle task/configuration names need the flavor capitalized (assembleFdroidDebug); the
        # APK output path and artifact name use it lowercase (outputs/apk/fdroid/debug/...) -
        # carrying both forms here avoids a run-time `tr`/templating step just to get casing right.
        # NOT `flavor`/`Flavor` as two separate matrix keys - GitHub's matrix schema treats
        # property names case-insensitively, so that pair is rejected at workflow-parse time as a
        # duplicate key ("'Flavor' is already defined") even though plain YAML itself (and any
        # local `yaml.safe_load`) sees them as distinct strings. Confirmed directly against a real
        # failed run before landing this fix, not guessed.
        include:
          - flavor: fdroid
            taskFlavor: Fdroid
          - flavor: github
            taskFlavor: Github
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: android }
      # core has no publish step (android/CLAUDE.md: "Local dev against an unreleased core" is
      # the only supported mode) - org.squaddle:core:0.1.0-SNAPSHOT is never resolvable from
      # google()/mavenCentral(), so CI needs the same composite-build substitution local dev uses
      # (settings.gradle.kts's SQUADDLE_CORE_DIR), checked out as a true sibling directory.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: squaddle-org/core, path: core }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
      - run: ./gradlew :app:assemble${{ matrix.taskFlavor }}Debug
        env: { SQUADDLE_CORE_DIR: ../core }
      # Debug build, self-signed by AGP's built-in debug keystore - installable, but not a
      # release artifact. The signed release pipeline is release.yml (tag-triggered, pinned
      # container, protected environment), not this workflow.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.flavor }}-debug
          path: android/app/build/outputs/apk/${{ matrix.flavor }}/debug/app-${{ matrix.flavor }}-debug.apk
          if-no-files-found: error
      - run: ./gradlew :app:test${{ matrix.taskFlavor }}DebugUnitTest
        env: { SQUADDLE_CORE_DIR: ../core }
      # android/CLAUDE.md: fdroid/github must never pull in Google Play Services/Firebase.
      - name: Verify ${{ matrix.flavor }} classpath has no GMS/Firebase
        env: { SQUADDLE_CORE_DIR: ../core }
        run: |
          ./gradlew :app:dependencies --configuration ${{ matrix.flavor }}DebugRuntimeClasspath > deps.txt
          if grep -Eq 'com\.google\.android\.gms|com\.google\.firebase' deps.txt; then
            echo "GMS/Firebase artifact found on the ${{ matrix.flavor }} classpath:"
            grep -E 'com\.google\.android\.gms|com\.google\.firebase' deps.txt
            exit 1
          fi
