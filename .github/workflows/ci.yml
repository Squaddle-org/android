name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with: { path: android }
      # core has no publish step (android/CLAUDE.md: "Local dev against an unreleased core" is
      # the only supported mode) - org.squaddle:core:0.1.0-SNAPSHOT is never resolvable from
      # google()/mavenCentral(), so CI needs the same composite-build substitution local dev uses
      # (settings.gradle.kts's SQUADDLE_CORE_DIR), checked out as a true sibling directory.
      - uses: actions/checkout@v4
        with: { repository: squaddle-org/core, path: core }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleFossDebug
        env: { SQUADDLE_CORE_DIR: ../core }
      # Debug build, self-signed by AGP's built-in debug keystore - installable, but not a
      # release artifact. No signed-release pipeline exists yet (needs a real signing keystore +
      # secrets, a separate decision).
      - uses: actions/upload-artifact@v4
        with:
          name: app-foss-debug
          path: android/app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error
      - run: ./gradlew :app:testFossDebugUnitTest
        env: { SQUADDLE_CORE_DIR: ../core }
      # android/CLAUDE.md: foss must never pull in Google Play Services/Firebase.
      - name: Verify foss classpath has no GMS/Firebase
        env: { SQUADDLE_CORE_DIR: ../core }
        run: |
          ./gradlew :app:dependencies --configuration fossDebugRuntimeClasspath > deps.txt
          if grep -Eq 'com\.google\.android\.gms|com\.google\.firebase' deps.txt; then
            echo "GMS/Firebase artifact found on the foss classpath:"
            grep -E 'com\.google\.android\.gms|com\.google\.firebase' deps.txt
            exit 1
          fi
